<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golf Lounge -suunnittelija</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#111;color:#ddd;display:flex;height:100vh;overflow:hidden}
#side{width:300px;overflow:auto;padding:10px;background:#181a1d;border-right:1px solid #333}
#view{flex:1;position:relative;touch-action:none}
h1{font-size:16px;margin:0 0 8px}h2{font-size:13px;margin:14px 0 6px;color:#9ab;text-transform:uppercase}
button{background:#2a2e33;color:#eee;border:1px solid #444;border-radius:6px;padding:7px 9px;margin:2px;cursor:pointer;font-size:13px}
button:hover{background:#363b41}.danger{background:#5a2222}.big{background:#1f5f9a;font-weight:600;padding:10px 12px}
.row{display:flex;flex-wrap:wrap}label{display:flex;justify-content:space-between;align-items:center;margin:3px 0;gap:6px}
input,select{background:#222;color:#eee;border:1px solid #444;border-radius:4px;padding:4px;width:120px}
.cat{display:block;width:100%;text-align:left}.cat small{color:#888}
.li{padding:3px 6px;cursor:pointer;border-radius:4px}.li.sel{background:#1f5f9a}.li:hover{background:#2a2e33}
#objlist{max-height:180px;overflow:auto}#info{position:absolute;top:10px;left:10px;background:#000a;padding:8px 10px;border-radius:6px;max-width:380px;pointer-events:none}
.warn{color:#ffb347;margin-top:6px}.ok{color:#6c6;margin-top:6px}
#toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#1f5f9a;padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .3s}
details summary{cursor:pointer}
@media (max-width:800px){body{flex-direction:column-reverse}#side{width:100%;height:45vh}}
</style>
</head><body>
<div id="side">
  <h1>⛳ Golf Lounge -suunnittelija</h1>
  <h2>Jaa suunnitelma</h2>
  <div class="row"><button id="btnExport" class="big">⬇ Vie JSON</button><button id="btnImport" class="big">⬆ Tuo JSON</button></div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
  <div class="row"><button id="btnSave">Tallenna</button><button id="btnLoad">Lataa</button><button id="btnNew">Oletus</button></div>
  <h2>Näkymä</h2>
  <div class="row"><button id="btnTop">Ylänäkymä</button><button id="btnReset">Nollaa kamera</button><button id="btnQuality">Laatu</button><button id="btnHelpers">Apuviivat: päällä</button></div>
  <h2>Valittu esine</h2><div id="props"></div>
  <h2>Esineet</h2><div id="objlist"></div>
  <details><summary><h2 style="display:inline">Lisää esine</h2></summary><div id="catalog"></div></details>
  <p style="color:#777;font-size:12px">Huone 450 × 700 cm, katto 280 cm. Raahaa esineitä (5 cm askel). Seinäesineet liikkuvat seinää pitkin. Hiiri/kosketus: kierrä, vieritä/nipistä = zoom, oikea painike/kaksi sormea = siirrä.</p>
</div>
<div id="view"><div id="info"></div><div id="toast"></div></div>
