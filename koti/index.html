<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2a36">
<title>Koti 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1d2a36;color:#eee;touch-action:none;-webkit-user-select:none;user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:rgba(20,28,36,.82);z-index:5}
#bar .title{margin-right:4px}#bar button,#bar select{background:#2e3d4b;color:#eee;border:1px solid #4a5b6b;border-radius:6px;padding:5px 9px;font:inherit;cursor:pointer}
#bar button.on{background:#2a9d8f;border-color:#2a9d8f}.eye input{width:56px;background:#2e3d4b;color:#eee;border:1px solid #4a5b6b;border-radius:6px;padding:4px}
#banner{position:fixed;left:50%;transform:translateX(-50%);top:52px;background:#f4a261;color:#222;font-weight:600;padding:4px 10px;border-radius:6px;z-index:4;font-size:12px;max-width:94vw;text-align:center;pointer-events:none}
#roomhud{position:fixed;left:8px;bottom:8px;background:rgba(20,28,36,.82);padding:6px 10px;border-radius:8px;z-index:4;max-width:calc(100vw - 16px)}
#roomhud button{background:#2e3d4b;color:#eee;border:1px solid #4a5b6b;border-radius:4px;min-width:28px;margin-left:3px}
#roomhud .ph{color:#f4a261}
#hint{position:fixed;right:8px;bottom:8px;background:rgba(20,28,36,.6);padding:4px 8px;border-radius:6px;font-size:12px;z-index:3;pointer-events:none}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#fff;text-shadow:0 0 3px #000;pointer-events:none;z-index:3}
#joy{position:fixed;left:24px;bottom:64px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);z-index:4;touch-action:none}
#joy .knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
.panel{position:fixed;right:8px;top:60px;width:360px;max-width:calc(100vw - 16px);max-height:calc(100vh - 120px);overflow:auto;background:rgba(24,33,43,.96);border:1px solid #4a5b6b;border-radius:10px;z-index:6;user-select:text;-webkit-user-select:text;touch-action:pan-y}
.panel.side{left:8px;right:auto}.panel header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #3a4b5b;position:sticky;top:0;background:inherit}
.panel header button{background:none;border:none;color:#eee;font-size:18px;cursor:pointer;min-width:36px;min-height:36px}.panel .body{padding:8px 10px}
.kv{display:flex;gap:8px;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #33414f}.kv>span:first-child{color:#9fb0c0;flex:0 0 auto}
.badge{padding:1px 6px;border-radius:4px}.st-overdue .dot,.badge.st-overdue{background:#e5383b;color:#fff}.st-soon .dot,.badge.st-soon{background:#f4a261;color:#222}.st-ok .dot,.badge.st-ok{background:#2a9d8f;color:#fff}.st-unknown .dot,.badge.st-unknown{background:#4f7cac;color:#fff}
.tasks{margin:6px 0;padding-left:18px}.tasks li{margin:4px 0}.tasks li.st-overdue{color:#ff8a8c}.tasks li.st-soon{color:#ffc58f}
.warn{background:#5c1d1d;border:1px solid #e5383b;padding:6px;border-radius:6px;margin:6px 0}.links{display:flex;gap:12px;margin:8px 0}.links a{color:#8ecae6}
.muted{color:#8a99a8}.src{font-size:12px;color:#9fb0c0;margin-top:6px}.src a{color:#8ecae6}.notes{white-space:pre-wrap}
button.li{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #33414f;color:#eee;padding:8px 2px;font:inherit;cursor:pointer}button.li small{color:#9fb0c0;margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}.lrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #33414f}.lrow input[type=number]{width:60px}
.file{display:block;margin-top:10px;color:#9fb0c0}button.file{background:#2e3d4b;border:1px solid #4a5b6b;border-radius:6px;color:#eee;font:inherit;padding:6px 10px;cursor:pointer;width:100%}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;z-index:9}
@media (pointer:coarse){#bar button,#bar select{min-height:44px;min-width:44px;padding:6px 10px}#bar{gap:4px}.eye input{height:44px}.panel header button,#roomhud button{min-width:44px;min-height:44px}button.li{min-height:44px}.panel a,#roomhud a{display:inline-flex;align-items:center;min-height:44px;min-width:44px}.lrow input[type=checkbox]{width:44px;height:44px;margin:0 6px 0 0}.lrow input[type=range]{min-height:44px;width:120px}.lrow input[type=number]{min-height:44px;width:72px}button.file{min-height:44px}#bar .title{display:none}#roomhud{bottom:auto;top:auto;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));font-size:13px}#joy{bottom:calc(var(--hud-h, 40px) + 20px)}#hint{display:none}.panel{top:auto;bottom:0;left:0;right:0;width:auto;max-width:none;max-height:60vh;border-radius:12px 12px 0 0}#banner{top:auto;bottom:200px}}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D-näkymä"></canvas>
<div id="banner" hidden></div>
<header id="bar">
  <b class="title">Koti 3D</b>
  <button id="btnWalk" title="Kävelytila">🚶 Kävely</button>
  <button id="btnOrbit" title="Yleiskuva / pohja (M)">🗺 Yleiskuva</button>
  <span id="floorWrap" hidden><select id="floorSel" aria-label="Kerros"></select></span>
  <label class="eye" title="Silmäkorkeus">👁 <input id="eye" type="number" min="50" max="250" step="1" inputmode="numeric"> cm</label>
  <button id="btnDevices">🔧 Laitteet</button>
  <button id="btnLights">💡 Valot</button>
  <button id="btnHelp" aria-label="Ohje">?</button>
  <input type="file" id="devFile" accept=".json,application/json" hidden>
</header>
<div id="roomhud"></div>
<div id="hint"></div>
<div id="crosshair" hidden>+</div>
<div id="joy" hidden><div class="knob"></div></div>
<aside id="devpanel" class="panel" hidden><header><b id="devTitle"></b><button id="closePanel" aria-label="Sulje">✕</button></header><div id="devBody" class="body"></div></aside>
<aside id="devlist" class="panel side" hidden><header><b>Laitteet</b><button data-close="devlist" aria-label="Sulje">✕</button></header><div class="body"></div></aside>
<aside id="lights" class="panel side" hidden><header><b>Valot ja lattialämmitys (Gira X1)</b><button data-close="lights" aria-label="Sulje">✕</button></header><div class="body"></div></aside>
<aside id="help" class="panel side" hidden><header><b>Ohje</b><button data-close="help" aria-label="Sulje">✕</button></header><div class="body"></div></aside>
<div id="toast" hidden></div>
